}

}

}

/* === 进度条 === */
.progress-section {

  align-items: center;

}

.progress-bar {
  flex: 1;
  height: 8px;

  overflow: hidden;
}

.progress-fill {
  height: 100%;

}

.progress-text {
  font-size: 13px;

}

/* === 主区域 === */
.main {

}

/* === 分组 === */
.group {
  margin-bottom: 32px;
}

.group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.group-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;

}

.group-badge.leader { background: rgba(108,142,239,0.15); color: var(--accent); }
.group-badge.worker { background: rgba(74,196,160,0.15); color: var(--accent2); }
.group-badge.verifier { background: rgba(240,160,75,0.15); color: var(--warn); }

.group-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
}

.group-count {
  font-size: 13px;
  color: var(--muted);
}

/* === 角色卡片网格 === */
.role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.role-card {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.role-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.role-card.executing {
  border-color: var(--warn);
  box-shadow: 0 0 0 1px var(--warn), 0 0 20px rgba(240,160,75,0.15);
}

.role-card.done {
  border-color: var(--success);
  opacity: 0.85;
}

.role-card.failed {
  border-color: var(--danger);
}

/* 状态指示灯 */
.status-dot {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--idle);
  transition: all 0.3s ease;
}

.status-dot.executing {
  background: var(--warn);
  animation: pulse 1.5s ease-in-out infinite;
}

.status-dot.done { background: var(--success); }
.status-dot.failed { background: var(--danger); }
.status-dot.waiting { background: #ffd54f; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(240,160,75,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(240,160,75,0); }
}

/* 角色头像 */
.role-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--rule);
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.role-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.role-card.executing .role-avatar {
  border-color: var(--warn);
}

.role-card.done .role-avatar {
  border-color: var(--success);
}

/* 角色信息 */
.role-name {
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}

.role-duty {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

.role-status-text {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  min-height: 16px;
}

.role-card.executing .role-status-text { color: var(--warn); }
.role-card.done .role-status-text { color: var(--success); }
.role-card.failed .role-status-text { color: var(--danger); }

/* === 波次时间线 === */
.timeline-section {
  margin-top: 32px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 20px;
}

.timeline-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--ink);
}

.wave {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--bg);
  transition: all 0.3s ease;
}

.wave.active {
  background: rgba(108,142,239,0.1);
  border: 1px solid rgba(108,142,239,0.3);
}

.wave.done {
  opacity: 0.6;
}

.wave-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  width: 60px;
  flex-shrink: 0;
}

.wave-content {
  flex: 1;
  font-size: 13px;
  color: var(--muted);
}

.wave.done .wave-content { color: var(--success); }
.wave.active .wave-content { color: var(--ink); }

.wave-status {
  font-size: 12px;
  flex-shrink: 0;
}

.wave.done .wave-status { color: var(--success); }
.wave.active .wave-status { color: var(--warn); }

/* === 详情弹窗 === */
.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.detail-overlay.show {
  display: flex;
}

.detail-panel {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 28px;
  max-width: 460px;
  width: 90%;
}

.detail-panel img {
  height: 150px;
  width: auto;
  border-radius: 12px;
  margin: 0 auto 16px;
  display: block;
  background: #f8f3e9;
  border: 1px solid var(--rule);
  padding: 4px;
}

.detail-panel h3 {
  text-align: center;
  font-size: 20px;
  margin-bottom: 4px;
}

.detail-panel .detail-duty {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 16px;
}

.detail-panel .detail-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
}

.detail-panel .detail-row span:first-child { color: var(--muted); }
.detail-panel .detail-row span:last-child { color: var(--ink); font-weight: 500; }

.detail-close {
  display: block;
  margin: 20px auto 0;
  padding: 8px 24px;
  background: var(--bg3);
  border: 1px solid var(--rule);
  border-radius: 8px;
  color: var(--ink);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.detail-close:hover {
  background: var(--rule);
}

/* === 控制按钮 === */
.controls {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  gap: 8px;
  z-index: 100;
}

.ctrl-btn {
  padding: 10px 20px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--bg2);
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-btn:hover {
  background: var(--bg3);
  border-color: var(--accent);
}

.ctrl-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.ctrl-btn.primary:hover {
  background: #5a7fd9;
}

.ctrl-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* === 日志区 === */
.log-section {
  margin-top: 24px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 16px;
  max-height: 300px;
  overflow-y: auto;
}

.log-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--muted);
}

.log-entry {
  font-size: 13px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(58,67,88,0.5);
  font-family: "JetBrains Mono", "Consolas", monospace;
  color: var(--muted);
}

.log-entry .timestamp {
  color: var(--accent);
  margin-right: 8px;
}

.log-entry .role-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  margin-right: 6px;
}

.log-entry .role-tag.leader { background: rgba(108,142,239,0.15); color: var(--accent); }
.log-entry .role-tag.worker { background: rgba(74,196,160,0.15); color: var(--accent2); }
.log-entry .role-tag.verifier { background: rgba(240,160,75,0.15); color: var(--warn); }

/* === 办公室场景（MAVIS 风格走动交互） === */

/* 场景舞台：明亮清新办公风（配合白底立绘 multiply 无缝融合） */
#officeStage {
  position: relative;
  height: clamp(420px, 62vh, 560px);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(108,142,239,0.06), transparent 50%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(108,142,239,0.06) 39px, rgba(108,142,239,0.06) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(108,142,239,0.06) 39px, rgba(108,142,239,0.06) 40px),
    linear-gradient(180deg, #1e2838 0%, #1a2332 40%, #151c28 100%);
  border: 1px solid #2a3548;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 32px;
  display: none;
  perspective: 700px;
  perspective-origin: 50% 30%;
}
#officeStage.show { display: block; }

/* 场景区块：无边框纯色块，靠家具与底色自然分区 */
.office-zone {
  position: absolute;
  border-radius: 14px;
  pointer-events: none;
}
.office-zone .zone-label { display: none; }

/* 休息室娱乐设施：纯 emoji 图标（无框无文字） */
.facility {
  position: absolute;
  font-size: 22px;
  line-height: 1;
  z-index: 5;
  transform: translateY(-50%);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
  pointer-events: none;
}

/* 办公家具（JS 按点位生成）：桌+显示器，熊在桌后似落座 */
.fdesk {
  position: absolute;
  width: 44px; margin-left: -22px;
  z-index: 11; pointer-events: none;
}
.fdesk .desk-top {
  height: 7px; border-radius: 3px;
  background: linear-gradient(180deg, #8a7a62, #5d5040);
  box-shadow: 0 2px 5px rgba(0,0,0,0.35);
}
.fdesk .desk-legbar {
  width: 6px; height: 12px; background: #4a4034;
  margin: 0 auto; border-radius: 0 0 2px 2px;
}
.fdesk .monitor {
  position: absolute; top: -26px; left: 50%;
  transform: translateX(-50%);
  width: 18px; height: 15px; border-radius: 2px;
  background: #39445c; border: 1px solid #55627f;
  box-shadow: 0 0 8px rgba(108,142,239,0.3);
}
.fdesk .monitor::after {
  content: ''; position: absolute; bottom: -5px; left: 50%;
  transform: translateX(-50%);
  width: 7px; height: 5px; background: #39445c;
  border-radius: 0 0 2px 2px;
}
.fdesk.wide { width: 64px; margin-left: -32px; }
.fdesk.wide .monitor { width: 24px; height: 18px; top: -30px; }

/* 货架 / 工作台等大件 emoji 家具 */
.bigfurn {
  position: absolute;
  font-size: 26px; line-height: 1;
  z-index: 5; pointer-events: none;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
}

.bear {
  position: absolute;
  width: 66px; margin-left: -33px; margin-top: -100px;
  transition: left 1.6s cubic-bezier(.45,.05,.55,.95), top 1.6s cubic-bezier(.45,.05,.55,.95), opacity .5s;
  z-index: 10; cursor: pointer; text-align: center; user-select: none;
}

/* 聚焦模式：任务执行期间，空闲角色降透明度，突出干活的人 */
.bear.dimmed { opacity: 0.3; }
.bear.dimmed:hover { opacity: 1; }

/* 角色立绘小人：全身立绘 + CSS 变换动画（无精灵图集，无帧闪烁，无白边） */
.bear-body {
  position: relative;
  transition: transform .25s;
  animation: idle-breath 3s ease-in-out infinite;
}
.bear:hover .bear-body { transform: scale(1.1); }
.bear.walking .bear-body { animation: walk-bounce 0.3s infinite ease-in-out; }
.bear.executing .bear-body { animation: work-sway 0.55s infinite ease-in-out; }
.bear.walking.left .bear-body { animation: walk-bounce-left 0.3s infinite ease-in-out; }

@keyframes idle-breath { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1px) scale(1.02); } }
@keyframes walk-bounce {
  0%, 100% { transform: translateY(0) rotate(-3deg) scaleY(1); }
  25%      { transform: translateY(-6px) rotate(0deg) scaleY(1.03); }
  50%      { transform: translateY(0) rotate(3deg) scaleY(1); }
  75%      { transform: translateY(-6px) rotate(0deg) scaleY(1.03); }
}
@keyframes walk-bounce-left {
  0%, 100% { transform: translateY(0) rotate(3deg) scaleX(-1) scaleY(1); }
  25%      { transform: translateY(-6px) rotate(0deg) scaleX(-1) scaleY(1.03); }
  50%      { transform: translateY(0) rotate(-3deg) scaleX(-1) scaleY(1); }
  75%      { transform: translateY(-6px) rotate(0deg) scaleX(-1) scaleY(1.03); }
}
@keyframes work-sway { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-1.5deg); } 70% { transform: rotate(1.5deg); } }

/* 角色立绘图片（透明背景，无卡片框，drop-shadow 浮于地面） */
.bear-portrait {
  width: 60px; height: 80px;
  object-fit: contain;
  object-position: center bottom;
  display: block;
  margin: 0 auto;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
  transition: filter 0.3s;
}

/* 走路时影子缩小跳动 */
.bear.walking::after { animation: shadow-bounce 0.4s infinite ease-in-out; }
@keyframes shadow-bounce { 0%,100% { transform: translateX(-50%) scale(1); opacity:0.28; } 50% { transform: translateX(-50%) scale(0.72); opacity:0.18; } }

/* 角色头像（白底 multiply 融入场景） */
.bear .bear-img {
  height: 78px; width: auto;
  display: block; margin: 0 auto;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 1px 1px rgba(80,60,30,0.12));
}

/* 活动指示器：角色头顶显示当前活动 */
.bear-activity {
  position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
  font-size: 16px; line-height: 1; z-index: 14;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  pointer-events: none; opacity: 0; transition: opacity .4s;
  animation: activity-float 2s ease-in-out infinite;
}
.bear.has-activity .bear-activity { opacity: 1; }
@keyframes activity-float { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-3px); } }

/* 影子（暗色地面适配） */
.bear::after {
  content: ''; position: absolute; left: 50%; bottom: 15px;
  transform: translateX(-50%);
  width: 38px; height: 9px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, transparent 65%);
  transition: transform .3s, opacity .3s; pointer-events: none;
}
.bear.walking::after { transform: translateX(-50%) scale(0.78); opacity: 0.6; }

/* 状态徽章 */
.bear-badge {
  position: absolute; top: -7px; right: -3px;
  font-size: 13px; line-height: 1; z-index: 12;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
  pointer-events: none;
}

.bear .bear-name { font-size: 10px; color: #8892a6; margin-top: 2px; white-space: nowrap; transition: color .3s; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.bear.executing .bear-portrait { filter: drop-shadow(0 0 8px rgba(46,184,138,0.8)) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.bear.executing .bear-name { color: #1f9d6f; }
.bear.waiting .bear-portrait { filter: drop-shadow(0 0 6px rgba(230,150,50,0.7)) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.bear.waiting .bear-name { color: #c07820; }
.bear.done .bear-portrait { filter: drop-shadow(0 0 5px rgba(60,180,110,0.5)) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.bear.done .bear-name { color: #2f9e63; }
.bear.failed .bear-portrait { filter: drop-shadow(0 0 7px rgba(220,80,80,0.7)) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.bear.failed .bear-name { color: #cc4444; }
.bear.walking.left .bear-body { transform: scaleX(-1); }

.bubble {
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: #fff; color: #1a1f2e;
  border: 1px solid #d5cab5;
  font-size: 11px; line-height: 1.45;
  padding: 5px 10px; border-radius: 9px;
  max-width: 190px; width: max-content;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 30; box-shadow: 0 2px 10px rgba(120,100,60,0.25);
}
.bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.bubble::after {
  content: ''; position: absolute; top: 100%; left: 50%; margin-left: -5px;
  border: 5px solid transparent; border-top-color: #fff;
}

/* === 响应式 === */
@media (max-width: 768px) {
  .role-grid { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: flex-start; }
  .progress-section { width: 100%; }
}

/* === 实时模式按钮 === */
.live-btn { border: 1px solid var(--accent2) !important; color: var(--accent2) !important; }
.live-btn.active { background: var(--accent2) !important; color: #1a1f2e !important; font-weight: 700; }

/* === WebSocket 状态 === */
.ws-status { font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--bg3); white-space: nowrap; }
.ws-status.connecting { color: var(--warn); }
.ws-status.connected { color: var(--success); }
.ws-status.disconnected { color: var(--warn); }
.ws-status.error { color: var(--danger); }

/* === 控制栏 === */
.controls { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
</style>

<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">熊出没集团</div>
    <div class="topbar-task">当前任务：<span id="taskName">空闲</span></div>
  </div>
  <div class="progress-section">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0/0</div>
  </div>
</div>

<!-- 主区域 -->
<div class="main">

  <!-- 办公室场景（MAVIS 风格小人世界） -->
  <div id="officeStage">

function renderTimeline(waves, currentWave) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = waves.map((w, i) => {

    const status = i + 1 < currentWave ? '✓ 完成' : i + 1 === currentWave ? '⏳ 执行中' : '⬜ 待执行';
    return `<div class="wave ${cls}"><span class="wave-num">波次 ${i+1}</span><span class="wave-content">${w}</span><span class="wave-status">${status}</span></div>`;
  }).join('');
}

// === Canvas 抠白底：将角色图片的白底变透明 ===
const transparentCache = {};
function initTransparentSprites() {
  return Promise.all(ROLES.map(function(r) {
    return new Promise(function(resolve) {
      var src = r.sprite || r.img;
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        try {
          var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = imageData.data;
          for (var i = 0; i < data.length; i += 4) {
            var brightness = (data[i] + data[i+1] + data[i+2]) / 3;
            if (brightness > 240) {
              data[i+3] = 0;
            } else if (brightness > 210) {
              data[i+3] = Math.floor((240 - brightness) / 30 * 255);
            }
          }
          ctx.putImageData(imageData, 0, 0);
          transparentCache[r.id] = canvas.toDataURL('image/png');
        } catch(e) {
          transparentCache[r.id] = src;
        }
        resolve();
      };
      img.onerror = function() { transparentCache[r.id] = src; resolve(); };
      img.src = src;
    });
  }));
}

  // 无休息区：工位铺满左侧，验证区右侧，交付区中下，修复区左下
  const DESKS = [
    {x:12,y:15},{x:26,y:15},{x:40,y:15},
    {x:12,y:35},{x:26,y:35},{x:40,y:35},
    {x:12,y:55},{x:26,y:55},{x:40,y:55},
  ];
  const VERIFY_SPOTS = [{x:60,y:15},{x:75,y:15},{x:60,y:35},{x:75,y:35}];
  const CEO_DESK = {x:88,y:55};
  const DELIVERY_SPOT = {x:55,y:82};
  const FIX_SPOTS = [{x:12,y:78},{x:26,y:80},{x:40,y:78},{x:55,y:80}];
  // 休息区已撤销：idle = deskSpot（常驻工位）
  const GREETINGS = ['嗨！','忙啥呢？','加油！','辛苦啦！','今天状态不错','这块代码写得漂亮'];
  const STATUS_CLASS = { idle:'idle', executing:'executing', waiting:'waiting', done:'done', failed:'failed' };
  const STATUS_BADGE = { idle:'💤', executing:'⚡', waiting:'⏳', done:'✅', failed:'❌' };

  let inited = false;

  function jitter(spot, amp = 3) {
    return { x: spot.x + (Math.random() * amp * 2 - amp), y: spot.y + (Math.random() * amp * 2 - amp) };
  }

  function createBear(role) {
    const el = document.createElement('div');
    el.className = 'bear';
    // 说话气泡
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    // 状态徽章
    const badge = document.createElement('div');
    badge.className = 'bear-badge'; badge.textContent = '💤';
    // 角色立绘小人 + 活动指示器
    const body = document.createElement('div');
    body.className = 'bear-body';
    const portrait = document.createElement('img');
    portrait.className = 'bear-portrait';
    portrait.src = transparentCache[role.id] || role.sprite || role.img;
    portrait.alt = role.name;
    portrait.loading = 'lazy';
    body.appendChild(portrait);
    const activity = document.createElement('div');
    activity.className = 'bear-activity'; activity.textContent = '';
    // 名牌
    const name = document.createElement('div');
    name.className = 'bear-name'; name.textContent = role.name;
    el.appendChild(bubble); el.appendChild(badge); el.appendChild(activity); el.appendChild(body); el.appendChild(name);
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showDetail(role, roleStates[role.id] || { status: 'idle', task: '' });
    });
    document.getElementById('officeStage').appendChild(el);
    return { el, bubble, badge, activity, role, pos: null, status: 'idle', bubbleTimer: null, walkTimer: null, doneTimer: null, greetCooldown: {}, activityTimer: null };
  }

  // 生成办公桌（桌面+显示器），熊站在桌后似落座
  function createDesk(x, y, opts = {}) {
    const stage = document.getElementById('officeStage');
    const d = document.createElement('div');
    d.className = 'fdesk' + (opts.wide ? ' wide' : '');
    d.style.left = x + '%'; d.style.top = y + '%';
    if (opts.screen) d.setAttribute('data-screen', opts.screen);
    d.insertAdjacentHTML('beforeend', '<div class="desk-top"></div><div class="desk-legbar"></div><div class="monitor"></div>');
    const monitor = d.querySelector('.monitor');
    if (opts.screen) monitor.style.background = opts.screen;
    stage.appendChild(d);
    return d;
  }

  // 生成大件 emoji 家具（货架/工作台等）
  function createBigFurn(x, y, emoji) {
    const stage = document.getElementById('officeStage');
    const f = document.createElement('div');
    f.className = 'bigfurn'; f.textContent = emoji;
    f.style.left = x + '%'; f.style.top = y + '%';
    stage.appendChild(f);
    return f;
  }

  // 网格寻路：20×20 网格，每格5%，BFS找最短路径，绕开家具
  const GRID = 5, GW = 20, GH = 20;
  const FURN = [...DESKS, ...VERIFY_SPOTS, CEO_DESK, DELIVERY_SPOT, ...FIX_SPOTS];
  function isBlocked(gx, gy, target) {
    for (const f of FURN) {
      if (target && Math.abs(f.x - target.x) < 3 && Math.abs(f.y - target.y) < 3) continue;
      const fx = Math.round(f.x / GRID), fy = Math.round(f.y / GRID);
      if (Math.abs(gx - fx) <= 1 && Math.abs(gy - fy) <= 1) return true;
    }
    return false;
  }
  function findPath(from, to) {
    const sc = Math.round(from.x / GRID), sr = Math.round(from.y / GRID);
    const ec = Math.round(to.x / GRID), er = Math.round(to.y / GRID);
    if (sc === ec && sr === er) return [to];
    const visited = new Set([sc + ',' + sr]);
    const queue = [[sc, sr, [{x: from.x, y: from.y}]]];
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    while (queue.length) {
      const [cx, cy, path] = queue.shift();
      for (const [dx, dy] of dirs) {
        const nx = cx + dx, ny = cy + dy;
        const key = nx + ',' + ny;
        if (nx < 0 || nx >= GW || ny < 0 || ny >= GH || visited.has(key)) continue;
        if (isBlocked(nx, ny, to)) continue;
        visited.add(key);
        const npath = [...path, {x: nx * GRID, y: ny * GRID}];
        if (nx === ec && ny === er) return [...npath, to];
        queue.push([nx, ny, npath]);
      }
    }
    return [to]; // 无路径，直走
  }
  // 简化路径：去掉同方向中间点，只留拐弯点
  function simplifyPath(path) {
    if (path.length <= 2) return path;
    const out = [path[0]];
    for (let i = 1; i < path.length - 1; i++) {
      const p = path[i-1], c = path[i], n = path[i+1];
      if ((c.x - p.x) !== (n.x - c.x) || (c.y - p.y) !== (n.y - c.y)) out.push(c);
    }
    out.push(path[path.length - 1]);
    return out;
  }

  // 走到指定点位（寻路 + 逐段动画 + 朝向翻转）
  function place(bear, spot, opts = {}) {
    if (!spot) return;
    spot = opts.jitter ? jitter(spot) : spot;
    if (bear.pos && Math.abs(bear.pos.x - spot.x) < 0.5 && Math.abs(bear.pos.y - spot.y) < 0.5) return;
    if (!bear.pos) {
      bear.el.style.left = spot.x + '%'; bear.el.style.top = spot.y + '%';
      bear.pos = { ...spot }; return;
    }
    const rawPath = findPath(bear.pos, spot);
    const path = simplifyPath(rawPath);
    let i = 0;
    function step() {
      if (i >= path.length) {
        bear.el.style.transition = '';
        bear.el.classList.remove('walking');
        maybeGreet(bear);
        return;
      }
      const wp = path[i];
      const dx = wp.x - bear.pos.x, dy = wp.y - bear.pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const dur = Math.max(500, dist * 38);
      bear.el.style.transition = `left ${dur}ms cubic-bezier(.45,.05,.55,.95), top ${dur}ms cubic-bezier(.45,.05,.55,.95)`;
      bear.el.classList.toggle('left', dx < -0.1);
      bear.el.classList.add('walking');
      bear.el.style.left = wp.x + '%';
      bear.el.style.top = wp.y + '%';
      bear.pos = { ...wp };
      i++;
      clearTimeout(bear.walkTimer);
      bear.walkTimer = setTimeout(step, dur + 60);
    }
    step();
  }

  // 擦肩而过打招呼（动态交互）
  function maybeGreet(bear) {
    for (const id in bears) {
      if (id === bear.role.id) continue;
      const other = bears[id];
      if (!bear.pos || !other.pos) continue;
      const dx = Math.abs(bear.pos.x - other.pos.x);
      const dy = Math.abs(bear.pos.y - other.pos.y);
      const now = Date.now();
      const key = [bear.role.id, id].sort().join('|');
      if (dx < 6 && dy < 9 && (!bear.greetCooldown[key] || now - bear.greetCooldown[key] > 9000)) {
        bear.greetCooldown[key] = now;
        other.greetCooldown[key] = now;
        speak(bear.role.id, GREETINGS[Math.floor(Math.random() * GREETINGS.length)], 2200);
        setTimeout(() => speak(id, GREETINGS[Math.floor(Math.random() * GREETINGS.length)], 2200), 500);
        break;
      }
    }
  }

  // 说话气泡（textContent 防注入；同时最多 3 个，超量自动收起最早的）
  const activeBubbles = new Map(); // roleId → 显示时间戳
  function speak(roleId, message, duration = 3600) {
    const bear = bears[roleId];
    if (!bear || !message) return;
    if (!activeBubbles.has(roleId) && activeBubbles.size >= 3) {
      let oldestId = null, oldestTs = Infinity;
      for (const [id, ts] of activeBubbles) if (ts < oldestTs) { oldestTs = ts; oldestId = id; }
      if (oldestId && bears[oldestId]) {
        clearTimeout(bears[oldestId].bubbleTimer);
        bears[oldestId].bubble.classList.remove('show');
        activeBubbles.delete(oldestId);
      }
    }
    const text = String(message);
    bear.bubble.textContent = text.length > 42 ? text.slice(0, 42) + '…' : text;
    bear.bubble.classList.add('show');
    activeBubbles.set(roleId, Date.now());
    clearTimeout(bear.bubbleTimer);
    bear.bubbleTimer = setTimeout(() => {
      bear.bubble.classList.remove('show');
      activeBubbles.delete(roleId);
    }, duration);
  }

  // 气泡分级降噪：仅关键事件冒泡（收到任务/评估/驳回/修复/完成/交付），日常状态流转静默
  const KEY_EVENT_RE = /驳回|修复|完成|完毕|交付|放行|收到任务|评估|启动/;
  const SILENT_RE = /状态转换|状态：/;
  function announce(roleId, message) {
    const msg = String(message || '');
    if (!msg || SILENT_RE.test(msg) || !KEY_EVENT_RE.test(msg)) return;
    speak(roleId, msg, 3200);
  }

  // 任务是否进行中（executing/waiting/failed/done 未收工都算）——驱动聚焦模式与环境安静
  function taskActive() {
    return Object.values(bears).some(b => b.status !== 'idle');
  }

  // 聚焦模式：任务执行期间空闲角色降透明度，突出正在干活的人
  function refreshFocus() {
    const active = taskActive();
    for (const id in bears) {
      bears[id].el.classList.toggle('dimmed', active && bears[id].status === 'idle');
    }
  }

  function targetFor(bear, status) {
    const tier = bear.role.tier;
    if (status === 'executing') return bear.deskSpot;
    if (status === 'waiting') return bear.waitSpot;
    if (status === 'failed') {
      return tier === 'verifier' ? bear.deskSpot : bear.fixSpot;
    }
    return bear.deskSpot; // idle = 常驻工位
  }

  // 活动系统：工位待命活动 + 工作状态活动
  const IDLE_ACTS = ['💤','📝','💡','☕'];
  const WORK_ACTS = { executing: '⌨️', waiting: '⏳', done: '📦', failed: '🔧' };
  function setActivity(bear, emoji) {
    bear.activity.textContent = emoji || '';
    bear.el.classList.toggle('has-activity', !!emoji);
  }
  function startIdleActivity(bear) {
    setActivity(bear, IDLE_ACTS[Math.floor(Math.random() * IDLE_ACTS.length)]);
    clearTimeout(bear.activityTimer);
    bear.activityTimer = setTimeout(() => {
      if (bear.status === 'idle') startIdleActivity(bear);
    }, 6000 + Math.random() * 8000);
  }
  function stopActivity(bear) {
    clearTimeout(bear.activityTimer);
    setActivity(bear, '');
  }

  // 状态驱动走位：idle→常驻工位 / executing→工位 / done→交付后回工位 / failed→修复区
  function updateRole(roleId, status, task) {
    const bear = bears[roleId];
    if (!bear) return;
    bear.status = status;
    const cls = STATUS_CLASS[status] || 'idle';
    Object.values(STATUS_CLASS).forEach(c => bear.el.classList.toggle(c, c === cls));
    bear.badge.textContent = STATUS_BADGE[status] || '';
    // 活动指示器
    if (status === 'idle') { startIdleActivity(bear); }
    else if (WORK_ACTS[status]) { stopActivity(bear); setActivity(bear, WORK_ACTS[status]); }
    else { stopActivity(bear); }
    if (task && status === 'executing') speak(roleId, task, 3000);
    clearTimeout(bear.doneTimer);
    if (status === 'done') {
      place(bear, jitter(DELIVERY_SPOT, 6));
      bear.doneTimer = setTimeout(() => {
        if (bear.status === 'done') {
          place(bear, bear.deskSpot, { jitter: true });
          bear.status = 'idle';
          startIdleActivity(bear);
          refreshFocus();
        }
      }, 3200);
    } else {
      place(bear, targetFor(bear, status));
    }
    refreshFocus();
  }

  function resetAll() {
    activeBubbles.clear();
    for (const id in bears) {
      const bear = bears[id];
      bear.status = 'idle';
      bear.badge.textContent = STATUS_BADGE.idle;
      Object.values(STATUS_CLASS).forEach(c => bear.el.classList.remove(c));
      bear.el.classList.remove('walking', 'left', 'dimmed');
      clearTimeout(bear.bubbleTimer); clearTimeout(bear.walkTimer); clearTimeout(bear.doneTimer);
      bear.bubble.classList.remove('show');
      place(bear, bear.deskSpot);
      startIdleActivity(bear);
    }
  }

  // 任务完成：全员欢呼
  function celebrate() {
    Object.keys(bears).forEach((id, i) => {
      setTimeout(() => speak(id, i % 3 === 0 ? '任务完成！🎉' : '收工！', 3000), i * 180);
    });
  }

  // 无休息区：空闲角色常驻工位，不再闲逛
  // 闲聊：两只空闲的熊偶尔隔空搭话（低频；任务执行期间不打扰）
  setInterval(() => {
    if (taskActive()) return;
    const idle = Object.values(bears).filter(b => b.status === 'idle');
    if (idle.length >= 2 && Math.random() < 0.3) {
      const a = idle[Math.floor(Math.random() * idle.length)];
      const b = idle[Math.floor(Math.random() * idle.length)];
      if (a === b) return;
      speak(a.role.id, GREETINGS[Math.floor(Math.random() * GREETINGS.length)], 2400);
      setTimeout(() => speak(b.role.id, GREETINGS[Math.floor(Math.random() * GREETINGS.length)], 2400), 600);
    }
  }, 25000);

  function init() {
    if (inited) return;
    inited = true;
    // 点击场景空白处：召唤最近的空闲小人走过去（点击小人本身则弹出详情，不冒泡到此处）
    document.getElementById('officeStage').addEventListener('click', (e) => {
      if (e.target.closest('.bear')) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const x = Math.min(95, Math.max(5, ((e.clientX - rect.left) / rect.width) * 100));
      const y = Math.min(92, Math.max(8, ((e.clientY - rect.top) / rect.height) * 100));
      const idle = Object.values(bears).filter(b => b.status === 'idle');
      if (!idle.length) return;
      let nearest = null, best = Infinity;
      for (const b of idle) {
        if (!b.pos) continue;
        const d = Math.hypot(b.pos.x - x, b.pos.y - y);
        if (d < best) { best = d; nearest = b; }
      }
      if (nearest) {
        place(nearest, { x, y });
        speak(nearest.role.id, '来啦？叫我吗？', 2600);
      }
    });
    let deskIdx = 0, verifyIdx = 0, fixIdx = 0;
    // 家具：工位桌×9（蓝屏）/ 验证桌×4（橙屏）/ 总裁桌（宽）/ 交付货架 / 修复工作台
    DESKS.forEach(s => createDesk(s.x, s.y));
    VERIFY_SPOTS.forEach(s => createDesk(s.x, s.y, { screen: '#8a5a20' }));
    createDesk(CEO_DESK.x, CEO_DESK.y, { wide: true, screen: '#4a6fa5' });
    createBigFurn(68, 85, '📦');
    createBigFurn(5, 88, '🛠️');
    ROLES.forEach(role => {
      const bear = createBear(role);
      bears[role.id] = bear;
      if (role.tier === 'verifier') bear.deskSpot = VERIFY_SPOTS[verifyIdx++ % VERIFY_SPOTS.length];
      else if (role.tier === 'leader') bear.deskSpot = CEO_DESK;
      else if (role.id === 'luobotou') bear.deskSpot = { x: 26, y: 80 }; // 调试岗常驻修复区
      else bear.deskSpot = DESKS[deskIdx++ % DESKS.length];
      bear.idleSpot = bear.deskSpot; // 无休息区：idle 常驻工位
      bear.fixSpot = FIX_SPOTS[fixIdx++ % FIX_SPOTS.length];
      bear.waitSpot = jitter(bear.deskSpot, 4);
      place(bear, bear.deskSpot);
    });
  }

  return { init, updateRole, speak, announce, resetAll, celebrate };
})();

// 视图切换：小人世界（默认）↔ 花名册卡片
let officeMode = false;
function setOfficeMode(on) {
  officeMode = on;
  OfficeScene.init();
  document.getElementById('officeStage').classList.toggle('show', on);
  document.querySelectorAll('.main .group, .main .timeline-section').forEach(el => {
    el.style.display = on ? 'none' : '';
  });
  document.getElementById('viewBtn').textContent = on ? '花名册' : '小人世界';
}
function toggleOfficeMode() { setOfficeMode(!officeMode); }

// === SSE 实时模式（角色 ID 与服务器 state.js 统一为拼音体系，无需映射） ===
const STATUS_MAP = { 'IDLE': 'idle', 'WORKING': 'executing', 'WAITING': 'waiting', 'DONE': 'done', 'FAILED': 'failed' };

let evtSource = null;
let liveMode = false;
let sseReconnectTimer = null;

function toggleLiveMode() {
  liveMode = !liveMode;
  const btn = document.getElementById('liveBtn');
  const status = document.getElementById('wsStatus');
  if (liveMode) {
    btn.textContent = '实时模式: ON';
    btn.classList.add('active');
    connectSSE();
  } else {
    btn.textContent = '实时模式: OFF';
    btn.classList.remove('active');
    if (evtSource) { evtSource.close(); evtSource = null; }
    if (sseReconnectTimer) { clearTimeout(sseReconnectTimer); sseReconnectTimer = null; }
    status.textContent = '⚪ 未连接';
    status.className = 'ws-status';
  }
}

function connectSSE() {
  const status = document.getElementById('wsStatus');
  status.textContent = '🟡 连接中...';
  status.className = 'ws-status connecting';

  try {
    evtSource = new EventSource(`${location.protocol}//${location.host}/events`);
  } catch (e) {
    status.textContent = '🔴 连接失败';
    status.className = 'ws-status error';
    return;
  }

  evtSource.onopen = () => {
    status.textContent = '🟢 已连接';
    status.className = 'ws-status connected';
  };

  evtSource.addEventListener('init', (e) => {
    try { applyServerState(JSON.parse(e.data)); } catch {}
  });

  evtSource.addEventListener('update', (e) => {
    try { applyServerState(JSON.parse(e.data)); } catch {}
  });

  evtSource.onerror = () => {
    status.textContent = '🟠 已断开，重连中...';
    status.className = 'ws-status disconnected';
    if (evtSource) { evtSource.close(); evtSource = null; }
    if (liveMode) {
      sseReconnectTimer = setTimeout(connectSSE, 3000);
    }
  };
}

let lastSpokenLogId = null;
let celebrated = false;

function applyServerState(s) {
  if (s.task) {
    document.getElementById('taskName').textContent = s.task.title || '执行中';
  }

  s.roles.forEach(r => {
    if (roleStates[r.id]) {
      roleStates[r.id].status = STATUS_MAP[r.status] || 'idle';
      roleStates[r.id].task = r.task || '';
      OfficeScene.updateRole(r.id, STATUS_MAP[r.status] || 'idle', r.task);
    }
  });
  renderRoles();

  if (s.waves && s.waves.length > 0) {
    renderTimeline(s.waves.map(w => w.title || (w.roles ? w.roles.join(', ') : '')), s.currentWave + 1);
    updateProgress(s.currentWave + 1, s.waves.length);
  }

  if (s.logs && s.logs.length > 0) {
    // 新增日志驱动场景说话气泡（首次连接静默初始化基线）
    if (lastSpokenLogId === null) {
      lastSpokenLogId = s.logs[s.logs.length - 1].id || null;
    } else {
      const idx = s.logs.findIndex(l => l.id === lastSpokenLogId);
      const fresh = idx >= 0 ? s.logs.slice(idx + 1) : s.logs.slice(-3);
      fresh.forEach(l => { if (l.roleId) OfficeScene.announce(l.roleId, l.message); });
      lastSpokenLogId = s.logs[s.logs.length - 1].id || lastSpokenLogId;
    }
    logs = s.logs.map(l => {
      const role = ROLES.find(r => r.id === l.roleId);
      const d = new Date(l.timestamp);
      return {
        ts: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`,
        roleId: l.roleId,
        tier: role ? role.tier : 'worker',
        message: l.message,
      };
    });
    renderLogs();
  }

  // 任务完成：全员欢呼庆祝
  if (s.task && s.task.status === 'completed' && !celebrated) {
    celebrated = true;
    OfficeScene.celebrate();
  }
  if (s.task && s.task.status !== 'completed') celebrated = false;
}

// 角色立绘映射（AI 生成的 3D 低多边形 Q 版立绘，弓箭手大作战风格，白底）
ROLES.forEach(r => { r.sprite = `assets/characters/3d-${r.id}.jpg`; r.img = r.sprite; });

// === 初始化 ===
initState();
initTransparentSprites().then(() => {
  OfficeScene.init();
  setOfficeMode(true); // 默认进入小人世界（卡片降为「花名册」按需查看）
  renderRoles();
});
renderTimeline(DEMO_WAVES, 0);
updateProgress(0, 0);
</script>
