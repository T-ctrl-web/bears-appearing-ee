      <span class="group-badge verifier">Verifiers</span>

  <!-- 波次时间线 -->

  <span class="ws-status" id="wsStatus">⚪ 未连接</span>
</div>

<script>
// === 角色数据 ===
const ROLES = [
  { id:'xiongda', name:'熊大', duty:'总裁', tier:'leader', animal:'棕熊', char:'乐观勇敢聪明', img:'requirements-spec/assets/char-01-xiongda.jpg', color:'#D4A574',
    desc:'接收需求、评估复杂度、拆解、分配、汇总交付' },
  { id:'guangtouqiang', name:'光头强', duty:'架构', tier:'worker', animal:'人类·伐木工', char:'发明家脑子活', img:'requirements-spec/assets/char-02-guangtouqiang.jpg', color:'#6B8E23',
    desc:'技术方案设计、目录结构、技术选型' },
  { id:'xionger', name:'熊二', duty:'开发', tier:'worker', animal:'棕熊', char:'憨厚力大贪吃', img:'requirements-spec/assets/char-03-xionger.jpg', color:'#8B4513',
    desc:'代码实现、Bug修复' },
  { id:'luobotou', name:'萝卜头', duty:'调试', tier:'worker', animal:'鼹鼠', char:'聪明善于挖掘', img:'requirements-spec/assets/char-04-luobotou.jpg', color:'#9B8B6F',
    desc:'Bug定位、根因分析、挖洞式排查' },
  { id:'bengbeng', name:'蹦蹦', duty:'测试', tier:'worker', animal:'松鼠', char:'胆小但消息灵通', img:'requirements-spec/assets/char-05-bengbeng.jpg', color:'#FF8C00',
    desc:'测试用例、Bug报告' },
  { id:'cuihua', name:'翠花', duty:'界面', tier:'worker', animal:'母熊', char:'美丽动人爱打人', img:'requirements-spec/assets/char-06-cuihua.jpg', color:'#E6B4C4',
    desc:'UI设计、界面原型' },
  { id:'tutu', name:'涂涂', duty:'视觉', tier:'worker', animal:'猫头鹰', char:'夜视能力极强', img:'requirements-spec/assets/char-07-tutu.jpg', color:'#7B6B8F',
    desc:'像素级视觉审查、无障碍检查' },
  { id:'tuotuo', name:'拖拖', duty:'运维', tier:'worker', animal:'乌龟', char:'性格单纯稳扎稳打', img:'requirements-spec/assets/char-08-tuotuo.jpg', color:'#5F9EA0',
    desc:'环境搭建、部署支持、基础设施' },
  { id:'maomao', name:'毛毛', duty:'调研', tier:'worker', animal:'金色小猴', char:'吉吉的跟班', img:'requirements-spec/assets/char-09-maomao.jpg', color:'#DAA520',
    desc:'技术调研、竞品分析、情报搜集' },
  { id:'feibo', name:'肥波', duty:'文档', tier:'worker', animal:'肥猫', char:'光头强的宠物', img:'requirements-spec/assets/char-10-feibo.jpg', color:'#A9A9A9',
    desc:'文档编写、变更记录' },
  { id:'jiji', name:'吉吉国王', duty:'代码质检', tier:'verifier', animal:'猴子', char:'自封森林之王', img:'requirements-spec/assets/char-11-jjgw.jpg', color:'#FFD700',
    desc:'Level 1 柔性审查' },
  { id:'laoe', name:'老鳄', duty:'设计质检', tier:'verifier', animal:'鳄鱼', char:'自称百事通', img:'requirements-spec/assets/char-12-laoe.jpg', color:'#556B2F',
    desc:'Level 2 标准审查（最多2轮）' },
  { id:'xiaoli', name:'小狸', duty:'质量门禁', tier:'verifier', animal:'狐狸', char:'机灵狡黠', img:'requirements-spec/assets/char-13-xiaoli.jpg', color:'#FF7F50',
    desc:'交付前最终把关' },
  { id:'tiezhang', name:'铁掌大师', duty:'安全', tier:'verifier', animal:'东北虎', char:'武功高强', img:'requirements-spec/assets/char-14-tiezhang.jpg', color:'#B22222',
    desc:'Level 3 强对抗审查（最多3轮）' }
];

// === 状态 ===
let roleStates = {};
let logs = [];
let playing = false;

// 初始化状态
function initState() {
  roleStates = {};
  ROLES.forEach(r => {
    roleStates[r.id] = { status: 'idle', task: '', wave: 0 };
  });
  logs = [];
}

// === 渲染角色卡片 ===
function renderRoles() {
  const grids = { leader: document.getElementById('leaderGrid'), worker: document.getElementById('workerGrid'), verifier: document.getElementById('verifierGrid') };
  Object.values(grids).forEach(g => g.innerHTML = '');

  ROLES.forEach(role => {
    const grid = grids[role.tier] || grids.worker;
    const state = roleStates[role.id];
    const card = document.createElement('div');
    card.className = `role-card ${state.status}`;
    card.onclick = () => showDetail(role, state);
    card.innerHTML = `
      <div class="status-dot ${state.status}"></div>
      <div class="role-avatar"><img src="${role.img}" alt="${role.name}" loading="lazy"></div>
      <div class="role-name">${role.name}</div>
      <div class="role-duty">${role.duty}</div>
      <div class="role-status-text">${state.status === 'idle' ? '空闲' : state.status === 'executing' ? state.task : state.status === 'done' ? '已完成' : state.status === 'failed' ? '失败' : '等待验证'}</div>
    `;
    grid.appendChild(card);
  });
}

// === 详情弹窗 ===
function showDetail(role, state) {
  const overlay = document.getElementById('detailOverlay');
  document.getElementById('detailImg').src = role.img;
  document.getElementById('detailName').textContent = `${role.name}（${role.duty}）`;
  document.getElementById('detailDuty').textContent = `${role.animal} · ${role.char}`;
  const statusMap = { idle:'空闲', executing:'执行中', done:'已完成', failed:'失败', waiting:'等待验证' };
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-row"><span>角色</span><span>${role.duty}</span></div>
    <div class="detail-row"><span>动物原型</span><span>${role.animal}</span></div>
    <div class="detail-row"><span>性格特征</span><span>${role.char}</span></div>
    <div class="detail-row"><span>当前状态</span><span>${statusMap[state.status] || '空闲'}</span></div>
    <div class="detail-row"><span>当前任务</span><span>${state.task || '无'}</span></div>
    <div class="detail-row"><span>职责</span><span>${role.desc}</span></div>
    <div class="detail-row"><span>验证级别</span><span>${role.tier === 'verifier' ? (role.id === 'jiji' ? 'L1 柔性' : role.id === 'tiezhang' ? 'L3 强对抗' : 'L2 标准') : '—'}</span></div>
    <div class="detail-row"><span>最大迭代</span><span>${role.tier === 'verifier' ? (role.id === 'jiji' ? '1 次' : role.id === 'tiezhang' ? '3 次' : '2 次') : '—'}</span></div>
  `;
  overlay.classList.add('show');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
}

document.getElementById('detailOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

// === 日志 ===
function addLog(roleId, message) {
  const role = ROLES.find(r => r.id === roleId);
  if (!role) return;
  const tier = role.tier;
  const now = new Date();
  const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  logs.push({ ts, roleId, tier, message });
  renderLogs();
}

function renderLogs() {
  const area = document.getElementById('logArea');
  area.innerHTML = logs.slice(-50).map(l => {
    const role = ROLES.find(r => r.id === l.roleId);
    return `<div class="log-entry"><span class="timestamp">${l.ts}</span><span class="role-tag ${l.tier}">${role.name}</span>${l.message}</div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

// === 进度 ===
function updateProgress(current, total) {
  const pct = total > 0 ? (current / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${current}/${total}`;
}

// === 波次渲染 ===
function renderTimeline(waves, currentWave) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = waves.map((w, i) => {
    const cls = i + 1 < currentWave ? 'done' : i + 1 === currentWave ? 'active' : '';
    const status = i + 1 < currentWave ? '✓ 完成' : i + 1 === currentWave ? '⏳ 执行中' : '⬜ 待执行';
    return `<div class="wave ${cls}"><span class="wave-num">波次 ${i+1}</span><span class="wave-content">${w}</span><span class="wave-status">${status}</span></div>`;
  }).join('');
}

// === 更新角色状态 ===
function setRoleStatus(roleId, status, task) {
  if (roleStates[roleId]) {
    roleStates[roleId].status = status;
    roleStates[roleId].task = task || '';
    renderRoles();
  }
}

// === SSE 实时模式（角色 ID 与服务器 state.js 统一为拼音体系，无需映射） ===
const STATUS_MAP = { 'IDLE': 'idle', 'WORKING': 'executing', 'WAITING': 'waiting', 'DONE': 'done', 'FAILED': 'failed' };

let evtSource = null;
let liveMode = false;
let sseReconnectTimer = null;

function toggleLiveMode() {
  liveMode = !liveMode;
  const btn = document.getElementById('liveBtn');
  const status = document.getElementById('wsStatus');
  if (liveMode) {
    btn.textContent = '实时模式: ON';
    btn.classList.add('active');
    connectSSE();
  } else {
    btn.textContent = '实时模式: OFF';
    btn.classList.remove('active');
    if (evtSource) { evtSource.close(); evtSource = null; }
    if (sseReconnectTimer) { clearTimeout(sseReconnectTimer); sseReconnectTimer = null; }
    status.textContent = '⚪ 未连接';
    status.className = 'ws-status';
  }
}

function connectSSE() {
  const status = document.getElementById('wsStatus');
  status.textContent = '🟡 连接中...';
  status.className = 'ws-status connecting';

  try {
    evtSource = new EventSource('http://localhost:3120/events');
  } catch (e) {
    status.textContent = '🔴 连接失败';
    status.className = 'ws-status error';
    return;
  }

  evtSource.onopen = () => {
    status.textContent = '🟢 已连接';
    status.className = 'ws-status connected';
  };

  evtSource.addEventListener('init', (e) => {
    try { applyServerState(JSON.parse(e.data)); } catch {}
  });

  evtSource.addEventListener('update', (e) => {
    try { applyServerState(JSON.parse(e.data)); } catch {}
  });

  evtSource.onerror = () => {
    status.textContent = '🟠 已断开，重连中...';
    status.className = 'ws-status disconnected';
    if (evtSource) { evtSource.close(); evtSource = null; }
    if (liveMode) {
      sseReconnectTimer = setTimeout(connectSSE, 3000);
    }
  };
}

function applyServerState(s) {
  if (s.task) {
    document.getElementById('taskName').textContent = s.task.title || '执行中';
  }

  s.roles.forEach(r => {
    if (roleStates[r.id]) {
      roleStates[r.id].status = STATUS_MAP[r.status] || 'idle';
      roleStates[r.id].task = r.task || '';
    }
  });
  renderRoles();

  if (s.waves && s.waves.length > 0) {
    renderTimeline(s.waves.map(w => w.title || (w.roles ? w.roles.join(', ') : '')), s.currentWave + 1);
    updateProgress(s.currentWave + 1, s.waves.length);
  }

  if (s.logs && s.logs.length > 0) {
    logs = s.logs.map(l => {
      const role = ROLES.find(r => r.id === l.roleId);
      const d = new Date(l.timestamp);
      return {
        ts: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`,
        roleId: l.roleId,
        tier: role ? role.tier : 'worker',
        message: l.message,
      };
    });
    renderLogs();
  }
}
